name: Boot test merged jar
on:
  push:
    branches: [merge-test]
permissions:
  contents: write
jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Boot Forge with the jar
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick x11-apps > /dev/null
          pip install -q "portablemc<5"
          MC=$PWD/mc; mkdir -p $MC/mods
          cp jjk.jar $MC/mods/
          GL=$(curl -sSf 'https://api.modrinth.com/v2/project/geckolib/version?game_versions=%5B%221.20.1%22%5D&loaders=%5B%22forge%22%5D' | python3 -c "import json,sys; v=json.load(sys.stdin); print(v[0]['files'][0]['url'])")
          curl -sSfL -o $MC/mods/geckolib.jar "$GL"
          curl -sSfL -o $MC/mods/player-animation-lib-forge.jar "https://maven.kosmx.dev/dev/kosmx/player-anim/player-animation-lib-forge/1.0.2-rc1+1.20/player-animation-lib-forge-1.0.2-rc1+1.20.jar"
          printf 'onboardAccessibility:false\ntutorialStep:none\nrenderDistance:4\nsoundCategory_master:0.0\n' > $MC/options.txt
          ( timeout 420 xvfb-run -a -s "-screen 0 1280x720x24" portablemc --main-dir $MC --work-dir $MC start forge:1.20.1-47.3.0 -u Dev --resolution 1280x720 --jvm "$JAVA_HOME/bin/java" --jvm-args="-Xmx3G" > play-log.txt 2>&1 ) || true
          ls $MC/crash-reports 2>/dev/null || true
      - name: Publish
        if: always()
        run: |
          mkdir -p /tmp/out
          cp play-log.txt /tmp/out/ 2>/dev/null || true
          cp mc/logs/latest.log /tmp/out/game-latest.log 2>/dev/null || true
          cp mc/logs/debug.log /tmp/out/debug.log 2>/dev/null || true
          cp -r mc/crash-reports /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q -b merge-test-out && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m out && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" merge-test-out
