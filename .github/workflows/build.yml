name: Build Santoryu jar
on:
  push:
    branches: [santoryu]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}
      - name: Play every technique in the real game (software GL) and photograph it
        id: selftest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        env:
          SANTORYU_SELFTEST: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          mkdir -p run
          printf 'onboardAccessibility:false\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\nrenderDistance:6\nsimulationDistance:6\nmaxFps:60\nguiScale:2\nsoundCategory_master:0.0\nfov:0.0\n' > run/options.txt
          timeout 2100 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon 2>&1 | tee selftest-log.txt | grep --line-buffered -E "selftest|Santoryu|ERROR|Exception" || true
      - name: Publish jar and log to the santoryu-build branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build-log.txt /tmp/out/ || true
          cp selftest-log.txt /tmp/out/ 2>/dev/null || true
          cp run/logs/latest.log /tmp/out/game-latest.log 2>/dev/null || true
          mkdir -p /tmp/out/shots && cp run/screenshots/selftest/*.png /tmp/out/shots/ 2>/dev/null || true
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          rm -f /tmp/out/*-sources.jar
          echo "${{ steps.build.outcome }} ${{ github.sha }}" > /tmp/out/STATUS
          cd /tmp/out
          git init -q -b santoryu-build
          git config user.name "santoryu-ci"
          git config user.email "santoryu-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${{ github.sha }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" santoryu-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: santoryu-jar
          path: build/libs/*.jar
          if-no-files-found: ignore
      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
