name: Build mod jar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        timeout-minutes: 40
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish the build log if it failed
        if: failure()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/ 2>/dev/null || echo "no log" > /tmp/log/build.log
          cd /tmp/log
          git init -q -b ironlung-build-log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Failed build of $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ironlung-build-log

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ironlung-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Publish jar to the ironlung-build branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/out
          cp build/libs/ironlung-*.jar /tmp/out/
          rm -f /tmp/out/*-sources.jar
          cd /tmp/out
          git init -q -b ironlung-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Iron Lung mod jar\n\nBuilt from commit %s. Put the jar in .minecraft/mods (Forge 1.20.1).\n' "$GITHUB_SHA" > README.md
          git add -A
          git commit -q -m "Build of $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ironlung-build
