name: Build mod jar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: aegiscommand-forge-1.20.1
          path: build/libs/*.jar

      - name: Commit jar to dist/
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          rm -f dist/*.jar
          cp $(ls build/libs/*.jar | grep -v sources) dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "Add built jar [skip ci]"
          git push
