name: Transcribe voice lines
on:
  push:
    branches: [voice-asr]
permissions:
  contents: write
jobs:
  asr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install faster-whisper > pip.txt 2>&1 || true
          python3 asr.py > log.txt 2>&1 || true
      - if: always()
        run: |
          mkdir -p /tmp/o && cp result.txt log.txt pip.txt /tmp/o/ 2>/dev/null || true
          cd /tmp/o && git init -q -b voice-asr-out && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm out && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" voice-asr-out
