plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}
version = '1.0.0'
base { archivesName = 'sukuna-patch' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: mapping_channel, version: mapping_version
}
repositories {
    flatDir { dirs 'libs' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    mavenCentral()
}
configurations { bundled }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("local:jjk:1.0.0")
    compileOnly fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}")
    // GeckoLib: only for compiling the JJK key handler, which touches Geto's (GeckoLib) dragons
    compileOnly fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9")
    // pure-Java H.264 decoder for the Open cutscene (BSD-2-Clause), bundled into the jar
    implementation 'org.jcodec:jcodec:0.2.5'
    bundled 'org.jcodec:jcodec:0.2.5'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { finalizedBy 'reobfJar' }

tasks.register('patchedJar', Jar) {
    dependsOn 'reobfJar'
    archiveFileName = 'jjk-1.0.0.jar'
    destinationDirectory = file('build/out')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(['Specification-Title': 'jjk', 'Specification-Vendor': 'Ethan', 'Specification-Version': '1',
                    'Implementation-Title': 'jjk', 'Implementation-Version': '1.0.0', 'Implementation-Vendor': 'Ethan'])
    }
    from(zipTree(layout.buildDirectory.file("libs/sukuna-patch-1.0.0.jar"))) { exclude 'META-INF/**' }
    from({ configurations.bundled.collect { zipTree(it) } }) { exclude 'META-INF/**' }
    from(zipTree('libs/jjk-1.0.0.jar')) {
        exclude 'com/shrine/**'
        // the Gojo rework replaces these classes (the rest of each package stays as it was)
        exclude 'com/gojo/mod/GojoMod.class', 'com/gojo/mod/ModItems.class', 'com/gojo/mod/Techniques.class', 'com/gojo/mod/GojoEvents.class', 'com/gojo/mod/GojoEvents$*.class'
        exclude 'com/jjk/mod/Sorcerer.class', 'com/jjk/mod/Balance.class', 'com/jjk/mod/Balance$*.class'
        exclude 'com/jjk/mod/Dispatch.class', 'com/jjk/mod/Dispatch$*.class'
        exclude 'com/jjk/mod/client/Keys.class', 'com/jjk/mod/client/Keys$*.class'
        exclude 'assets/gojo/sounds.json', 'assets/gojo/lang/en_us.json'
        exclude 'META-INF/MANIFEST.MF'
    }
}
build.finalizedBy 'patchedJar'
