plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}
version = '1.0.0'
base { archivesName = 'naoya-patch' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: mapping_channel, version: mapping_version
}
repositories {
    flatDir { dirs 'libs' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // the rest of the JJK mod (Gojo, Sukuna, the core...) is compiled against, never rebuilt
    compileOnly fg.deobf("local:jjk:1.0.0")
    compileOnly fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}")
    compileOnly fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9")
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { finalizedBy 'reobfJar' }

// The deliverable: the original JJK jar with Naoya added and the few core classes that list sorcerers recompiled.
tasks.register('patchedJar', Jar) {
    dependsOn 'reobfJar'
    archiveFileName = 'jjk-1.0.0.jar'
    destinationDirectory = file('build/out')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(['Specification-Title': 'jjk', 'Specification-Vendor': 'Ethan', 'Specification-Version': '1',
                    'Implementation-Title': 'jjk', 'Implementation-Version': '1.0.0', 'Implementation-Vendor': 'Ethan'])
    }
    from(zipTree(layout.buildDirectory.file("libs/naoya-patch-1.0.0.jar"))) { exclude 'META-INF/**' }
    from(zipTree('libs/jjk-1.0.0.jar')) {
        exclude 'META-INF/MANIFEST.MF'
    }
}
build.finalizedBy 'patchedJar'
