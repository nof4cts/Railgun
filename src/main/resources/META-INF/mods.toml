modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Orbital Arsenal: two orbital cannons on one handheld uplink.
OA-01 Helios: a ring of orbital mirrors focuses the sun into a lance you steer with your crosshair, cutting molten trenches.
OA-02 Antipode: a breach opens beside the Earth, a mirror Earth comes through, and where the two touch the land is exchanged for the other world's, upside down.
Full cinematics from the ground to orbit and back, with anime impact frames. Plays alongside The Shooting Star (it does not need it).
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
