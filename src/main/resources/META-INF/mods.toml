modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Five fighting styles in one mod, switched with N:
Made in Heaven (a Stand that accelerates time), Silver Instinct (awakening, auto-dodge, ki and flight),
Santoryu (three-sword style), Requiem Rose (a divine reaper with an energy scythe) and Celestial Sage
(a sage god: null orbs, a staff of night, falling stars, a giant of light, the eclipse).
Cutscenes can be switched off for every style from the N menu.
Full cinematics, impact frames, light trails and sound.
Requiem Rose's aura shader is ported from Dragon Block Rebirth (MIT License, Copyright (c) 2026 Medrado26).
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=true
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
